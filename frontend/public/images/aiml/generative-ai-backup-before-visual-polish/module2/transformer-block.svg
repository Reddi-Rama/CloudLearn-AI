<text x="80" y="82" fill="#67e8f9" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="4">ATTENTION + FEED-FORWARD + RESIDUALS</text>
<text x="80" y="135" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="42" font-weight="800">Transformer Block</text>


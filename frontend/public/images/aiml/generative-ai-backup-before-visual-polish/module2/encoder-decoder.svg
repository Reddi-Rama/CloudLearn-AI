<text x="80" y="82" fill="#67e8f9" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="4">TRANSFORMER FAMILY</text>
<text x="80" y="135" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="42" font-weight="800">Encoder, Decoder &amp; Encoder–Decoder Architectures</text>

<rect x="120" y="280" width="360" height="160" rx="24" fill="#071827" stroke="#22d3ee" stroke-opacity=".45" stroke-width="2"/>
<rect x="120" y="280" width="7" height="160" rx="4" fill="#22d3ee" opacity=".85"/>
<text x="148" y="328" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="750">Encoder</text>
<text x="148" y="362" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="16">Reads / represents input</text>
<rect x="120" y="510" width="360" height="160" rx="24" fill="#100c25" stroke="#8b5cf6" stroke-opacity=".45" stroke-width="2"/>
<rect x="120" y="510" width="7" height="160" rx="4" fill="#8b5cf6" opacity=".85"/>

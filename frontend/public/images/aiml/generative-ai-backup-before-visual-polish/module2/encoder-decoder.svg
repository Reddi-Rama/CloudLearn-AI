<text x="148" y="592" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="16">Generates autoregressively</text>
<rect x="650" y="395" width="360" height="160" rx="24" fill="#071f1b" stroke="#34d399" stroke-opacity=".45" stroke-width="2"/>
<rect x="650" y="395" width="7" height="160" rx="4" fill="#34d399" opacity=".85"/>
<text x="678" y="443" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="750">Encoder–decoder</text>
<text x="678" y="477" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="16">Input representation + generation</text>
<rect x="1150" y="395" width="360" height="160" rx="24" fill="#21170a" stroke="#f59e0b" stroke-opacity=".45" stroke-width="2"/>
<rect x="1150" y="395" width="7" height="160" rx="4" fill="#f59e0b" opacity=".85"/>
<text x="1178" y="443" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="750">Use cases</text>
<text x="1178" y="477" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="16">Understanding • generation • translation • seq2seq</text>
<text x="80" y="850" fill="#64748b" font-family="Inter,Arial,sans-serif" font-size="16">Architectural families differ in how input context is encoded and how output tokens are generated.</text>

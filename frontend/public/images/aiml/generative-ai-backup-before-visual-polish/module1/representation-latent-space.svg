<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#020617"/>
    <stop offset="55%" stop-color="#071225"/>
    <stop offset="100%" stop-color="#0b1024"/>
  </linearGradient>
  <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#22d3ee"/>
    <stop offset="100%" stop-color="#38bdf8"/>
  </linearGradient>
  <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#8b5cf6"/>
    <stop offset="100%" stop-color="#c084fc"/>
  </linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#22d3ee"/></marker>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<circle cx="1450" cy="80" r="230" fill="#22d3ee" opacity=".035"/>
<circle cx="120" cy="820" r="260" fill="#8b5cf6" opacity=".035"/>
<text x="80" y="82" fill="#67e8f9" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="4">FROM DATA TO INTERNAL REPRESENTATION</text>
<text x="80" y="135" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="42" font-weight="800">Representation &amp; Latent Spaces</text>

<path d="M225,510 L575,360" stroke="#22d3ee" stroke-width="4" fill="none" marker-end="url(#arrow)" opacity=".9"/>
<path d="M575,510 L915,360" stroke="#22d3ee" stroke-width="4" fill="none" marker-end="url(#arrow)" opacity=".9"/>
<path d="M915,510 L1260,360" stroke="#22d3ee" stroke-width="4" fill="none" marker-end="url(#arrow)" opacity=".9"/>
<rect x="90" y="360" width="270" height="150" rx="24" fill="#071827" stroke="#22d3ee" stroke-opacity=".45" stroke-width="2"/>
<rect x="90" y="360" width="7" height="150" rx="4" fill="#22d3ee" opacity=".85"/>
<text x="118" y="408" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="750">Raw data</text>
<text x="118" y="442" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="16">Text / image / audio</text>
<rect x="430" y="360" width="290" height="150" rx="24" fill="#071827" stroke="#22d3ee" stroke-opacity=".45" stroke-width="2"/>
<rect x="430" y="360" width="7" height="150" rx="4" fill="#22d3ee" opacity=".85"/>
<text x="458" y="408" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="750">Tokens / features</text>
<text x="458" y="442" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="16">Discrete or structured</text>
<text x="458" y="467" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="16">representation</text>
<rect x="790" y="360" width="250" height="150" rx="24" fill="#100c25" stroke="#8b5cf6" stroke-opacity=".45" stroke-width="2"/>
<rect x="790" y="360" width="7" height="150" rx="4" fill="#8b5cf6" opacity=".85"/>
<text x="818" y="408" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="750">Embeddings</text>
<text x="818" y="442" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="16">Dense vectors</text>
<rect x="1110" y="360" width="300" height="150" rx="24" fill="#100c25" stroke="#8b5cf6" stroke-opacity=".45" stroke-width="2"/>
<rect x="1110" y="360" width="7" height="150" rx="4" fill="#8b5cf6" opacity=".85"/>
<text x="1138" y="408" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="750">Latent space</text>
<text x="1138" y="442" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="16">Hidden structure learned</text>
<text x="1138" y="467" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="16">by the model</text>
<text x="80" y="850" fill="#64748b" font-family="Inter,Arial,sans-serif" font-size="16">Latent spaces are internal representations where related patterns can become geometrically structured.</text>

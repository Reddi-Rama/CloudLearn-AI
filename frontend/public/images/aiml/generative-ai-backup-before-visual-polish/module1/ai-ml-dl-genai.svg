<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#020617"/>
    <stop offset="55%" stop-color="#071225"/>
    <stop offset="100%" stop-color="#0b1024"/>
  </linearGradient>
  <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#22d3ee"/>
    <stop offset="100%" stop-color="#38bdf8"/>
  </linearGradient>
  <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#8b5cf6"/>
    <stop offset="100%" stop-color="#c084fc"/>
  </linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#22d3ee"/></marker>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<circle cx="1450" cy="80" r="230" fill="#22d3ee" opacity=".035"/>
<circle cx="120" cy="820" r="260" fill="#8b5cf6" opacity=".035"/>
<text x="80" y="82" fill="#67e8f9" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="4">CONCEPTUAL HIERARCHY</text>
<text x="80" y="135" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="42" font-weight="800">AI → ML → DL → Generative AI</text>

<path d="M250,480 L610,330" stroke="#22d3ee" stroke-width="4" fill="none" marker-end="url(#arrow)" opacity=".9"/>
<path d="M610,480 L970,330" stroke="#22d3ee" stroke-width="4" fill="none" marker-end="url(#arrow)" opacity=".9"/>
<path d="M970,480 L1330,330" stroke="#22d3ee" stroke-width="4" fill="none" marker-end="url(#arrow)" opacity=".9"/>
<rect x="100" y="330" width="300" height="150" rx="24" fill="#071827" stroke="#22d3ee" stroke-opacity=".45" stroke-width="2"/>
<rect x="100" y="330" width="7" height="150" rx="4" fill="#22d3ee" opacity=".85"/>
<text x="128" y="378" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="750">Artificial Intelligence</text>
<text x="128" y="412" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="16">Machines performing tasks</text>
<text x="128" y="437" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="16">associated with intelligence</text>
<rect x="460" y="330" width="300" height="150" rx="24" fill="#071827" stroke="#22d3ee" stroke-opacity=".45" stroke-width="2"/>
<rect x="460" y="330" width="7" height="150" rx="4" fill="#22d3ee" opacity=".85"/>
<text x="488" y="378" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="750">Machine Learning</text>
<text x="488" y="412" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="16">Learning patterns from data</text>
<rect x="820" y="330" width="300" height="150" rx="24" fill="#100c25" stroke="#8b5cf6" stroke-opacity=".45" stroke-width="2"/>
<rect x="820" y="330" width="7" height="150" rx="4" fill="#8b5cf6" opacity=".85"/>
<text x="848" y="378" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="750">Deep Learning</text>
<text x="848" y="412" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="16">Multi-layer neural networks</text>
<rect x="1180" y="330" width="300" height="150" rx="24" fill="#071f1b" stroke="#34d399" stroke-opacity=".45" stroke-width="2"/>
<rect x="1180" y="330" width="7" height="150" rx="4" fill="#34d399" opacity=".85"/>
<text x="1208" y="378" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="750">Generative AI</text>
<text x="1208" y="412" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="16">Learning to generate</text>
<text x="1208" y="437" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="16">new content</text>
<text x="80" y="850" fill="#64748b" font-family="Inter,Arial,sans-serif" font-size="16">Each stage is a subset-style conceptual relationship, not a strict taxonomy of every AI system.</text>
</svg>
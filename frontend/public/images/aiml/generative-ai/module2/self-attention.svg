<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="-80 0 1760 900">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#020617"/>
    <stop offset="55%" stop-color="#071225"/>
    <stop offset="100%" stop-color="#0b1024"/>
  </linearGradient>
  <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#22d3ee"/>
    <stop offset="100%" stop-color="#38bdf8"/>
  </linearGradient>
  <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#8b5cf6"/>
    <stop offset="100%" stop-color="#c084fc"/>
  </linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#22d3ee"/></marker>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<circle cx="1450" cy="80" r="230" fill="#22d3ee" opacity=".035"/>
<circle cx="120" cy="820" r="260" fill="#8b5cf6" opacity=".035"/>
<text x="80" y="82" fill="#67e8f9" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="4">HOW TOKENS INTERACT</text>
<text x="80" y="135" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="42" font-weight="800">Self-Attention</text>

<rect x="80" y="350" width="260" height="170" rx="24" fill="#071827" stroke="#22d3ee" stroke-opacity=".45" stroke-width="2"/>
<rect x="80" y="350" width="7" height="170" rx="4" fill="#22d3ee" opacity=".85"/>
<text x="108" y="398" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="750">Input hidden states</text>
<text x="108" y="432" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="16">X = [x₁ … xₙ]</text>
<rect x="430" y="220" width="250" height="130" rx="24" fill="#100c25" stroke="#8b5cf6" stroke-opacity=".45" stroke-width="2"/>
<rect x="430" y="220" width="7" height="130" rx="4" fill="#8b5cf6" opacity=".85"/>
<text x="458" y="268" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="750">Queries Q</text>
<text x="458" y="302" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="16">What each position asks</text>
<rect x="430" y="360" width="250" height="130" rx="24" fill="#100c25" stroke="#8b5cf6" stroke-opacity=".45" stroke-width="2"/>
<rect x="430" y="360" width="7" height="130" rx="4" fill="#8b5cf6" opacity=".85"/>
<text x="458" y="408" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="750">Keys K</text>
<text x="458" y="442" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="16">What each position offers</text>
<rect x="430" y="500" width="250" height="130" rx="24" fill="#100c25" stroke="#8b5cf6" stroke-opacity=".45" stroke-width="2"/>
<rect x="430" y="500" width="7" height="130" rx="4" fill="#8b5cf6" opacity=".85"/>
<text x="458" y="548" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="750">Values V</text>
<text x="458" y="582" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="16">Information to aggregate</text>
<rect x="790" y="350" width="310" height="170" rx="24" fill="#100c25" stroke="#8b5cf6" stroke-opacity=".45" stroke-width="2"/>
<rect x="790" y="350" width="7" height="170" rx="4" fill="#8b5cf6" opacity=".85"/>
<text x="818" y="398" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="750">Attention scores</text>
<text x="818" y="432" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="16">softmax(QKᵀ / √dₖ)</text>
<rect x="1210" y="350" width="330" height="170" rx="24" fill="#071f1b" stroke="#34d399" stroke-opacity=".45" stroke-width="2"/>
<rect x="1210" y="350" width="7" height="170" rx="4" fill="#34d399" opacity=".85"/>
<text x="1238" y="398" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="750">Weighted output</text>
<text x="1238" y="432" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="16">Context-aware representation</text>
<text x="80" y="850" fill="#64748b" font-family="Inter,Arial,sans-serif" font-size="16">Self-attention lets each token combine information from other positions according to learned relevance.</text>
</svg>
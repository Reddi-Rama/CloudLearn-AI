<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="-80 0 1760 900">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#020617"/>
    <stop offset="55%" stop-color="#071225"/>
    <stop offset="100%" stop-color="#0b1024"/>
  </linearGradient>
  <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#22d3ee"/>
    <stop offset="100%" stop-color="#38bdf8"/>
  </linearGradient>
  <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#8b5cf6"/>
    <stop offset="100%" stop-color="#c084fc"/>
  </linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#22d3ee"/></marker>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<circle cx="1450" cy="80" r="230" fill="#22d3ee" opacity=".035"/>
<circle cx="120" cy="820" r="260" fill="#8b5cf6" opacity=".035"/>
<text x="80" y="82" fill="#67e8f9" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="4">LONG-CONTEXT INFERENCE</text>
<text x="80" y="135" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="42" font-weight="800">Context Window &amp; KV Cache</text>

<path d="M205,520 L530,350" stroke="#22d3ee" stroke-width="4" fill="none" marker-end="url(#arrow)" opacity=".9"/>
<path d="M530,520 L870,350" stroke="#22d3ee" stroke-width="4" fill="none" marker-end="url(#arrow)" opacity=".9"/>
<path d="M870,520 L1200,350" stroke="#22d3ee" stroke-width="4" fill="none" marker-end="url(#arrow)" opacity=".9"/>
<path d="M1200,520 L1475,350" stroke="#22d3ee" stroke-width="4" fill="none" marker-end="url(#arrow)" opacity=".9"/>
<rect x="80" y="350" width="250" height="170" rx="24" fill="#071827" stroke="#22d3ee" stroke-opacity=".45" stroke-width="2"/>
<rect x="80" y="350" width="7" height="170" rx="4" fill="#22d3ee" opacity=".85"/>
<text x="108" y="398" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="750">Prompt tokens</text>
<text x="108" y="432" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="16">Visible context</text>
<rect x="400" y="350" width="260" height="170" rx="24" fill="#100c25" stroke="#8b5cf6" stroke-opacity=".45" stroke-width="2"/>
<rect x="400" y="350" width="7" height="170" rx="4" fill="#8b5cf6" opacity=".85"/>
<text x="428" y="398" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="750">Attention layers</text>
<text x="428" y="432" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="16">Compute Q, K, V</text>
<rect x="730" y="350" width="280" height="170" rx="24" fill="#071f1b" stroke="#34d399" stroke-opacity=".45" stroke-width="2"/>
<rect x="730" y="350" width="7" height="170" rx="4" fill="#34d399" opacity=".85"/>
<text x="758" y="398" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="750">K / V cache</text>
<text x="758" y="432" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="16">Reuse previous keys</text>
<text x="758" y="457" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="16">and values</text>
<rect x="1080" y="350" width="240" height="170" rx="24" fill="#100c25" stroke="#8b5cf6" stroke-opacity=".45" stroke-width="2"/>
<rect x="1080" y="350" width="7" height="170" rx="4" fill="#8b5cf6" opacity=".85"/>
<text x="1108" y="398" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="750">New token</text>
<text x="1108" y="432" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="16">One-step decoding</text>
<rect x="1390" y="350" width="170" height="170" rx="24" fill="#21170a" stroke="#f59e0b" stroke-opacity=".45" stroke-width="2"/>
<rect x="1390" y="350" width="7" height="170" rx="4" fill="#f59e0b" opacity=".85"/>
<text x="1418" y="398" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="750">Updated context</text>
<text x="1418" y="432" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="16">Cache grows with generation</text>
<text x="80" y="850" fill="#64748b" font-family="Inter,Arial,sans-serif" font-size="16">KV caching avoids recomputing keys and values for all previously processed tokens during autoregressive decoding.</text>
</svg>